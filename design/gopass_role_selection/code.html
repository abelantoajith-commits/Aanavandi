<script>
  (function() {

    const conductorBtn = document.getElementById('btn-conductor');
    const syncBtn = document.getElementById('btn-ping');
    const syncIcon = document.getElementById('sync-icon');
    const syncTime = document.getElementById('sync-time');

    if (studentBtn) {
      studentBtn.addEventListener('click', function() {
        this.classList.add('scale-95');
        setTimeout(() => this.classList.remove('scale-95'), 120);
      });
    }

    if (conductorBtn) {
      conductorBtn.addEventListener('click', function() {
        this.classList.add('scale-95');
        setTimeout(() => this.classList.remove('scale-95'), 120);
      });
    }

    if (syncBtn) {
      syncBtn.addEventListener('click', function() {
        syncIcon.classList.add('animate-spin');
        setTimeout(() => {
          syncIcon.classList.remove('animate-spin');
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const mins = String(now.getMinutes()).padStart(2, '0');
          if (syncTime) {
            syncTime.textContent = `Sync: Today ${hours}:${mins} (Valid Offline)`;
          }
        }, 600);
      });
    }
